<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#181335"/>
      <stop offset="100%" stop-color="#05050e"/>
    </radialGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    
    <!-- Violet Gradient -->
    <linearGradient id="violet-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c7ff"/>
      <stop offset="50%" stop-color="#bdb2ff"/>
      <stop offset="100%" stop-color="#7d6bfa"/>
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg-glow)"/>
  
  <!-- Outer Cosmic Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#violet-gradient)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold-gradient)" stroke-width="4" filter="url(#gold-glow)"/>
  
  <!-- Sacred Geometry: Seed of Life (6 Overlapping Circles) -->
  <g fill="none" stroke="url(#violet-gradient)" stroke-width="2.5" opacity="0.8">
    <!-- Center Circle -->
    <circle cx="256" cy="256" r="75" stroke="url(#gold-gradient)" stroke-width="3" filter="url(#gold-glow)"/>
    <!-- Top Circle -->
    <circle cx="256" cy="181" r="75"/>
    <!-- Top Right Circle -->
    <circle cx="321" cy="218.5" r="75"/>
    <!-- Bottom Right Circle -->
    <circle cx="321" cy="293.5" r="75"/>
    <!-- Bottom Circle -->
    <circle cx="256" cy="331" r="75"/>
    <!-- Bottom Left Circle -->
    <circle cx="191" cy="293.5" r="75"/>
    <!-- Top Left Circle -->
    <circle cx="191" cy="218.5" r="75"/>
  </g>

  <!-- Outer Overlapping Rays -->
  <g fill="none" stroke="url(#gold-gradient)" stroke-width="1" opacity="0.4">
    <!-- Star rays pointing to vertices -->
    <line x1="256" y1="56" x2="256" y2="456"/>
    <line x1="56" y1="256" x2="456" y2="256"/>
    <line x1="114" y1="114" x2="398" y2="398"/>
    <line x1="114" y1="398" x2="398" y2="114"/>
  </g>

  <!-- Glowing Center Star (Crystalline Core) -->
  <path d="M256,226 L264,248 L286,256 L264,264 L256,286 L248,264 L226,256 L248,248 Z" fill="url(#gold-gradient)" filter="url(#gold-glow)"/>
  
  <!-- Subtle Dot Grid at geometric intersections -->
  <circle cx="256" cy="106" r="3" fill="#ffe699"/>
  <circle cx="256" cy="406" r="3" fill="#ffe699"/>
  <circle cx="106" cy="256" r="3" fill="#ffe699"/>
  <circle cx="406" cy="256" r="3" fill="#ffe699"/>
</svg>
