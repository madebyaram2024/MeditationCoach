    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-glow)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring-gradient)" stroke-width="12" filter="url(#neon-glow)"/>
